---
# Matrix commands are installed only while Matrix alert delivery is selected.
homelab_scheduled_job_names: "{{ ['homelab-monitor', 'homelab-matrix-backup', 'homelab-recovery'] + (['homelab-matrix-status'] if homelab_scheduled_monitor_config.notification.type == 'matrix' else []) }}"

homelab_scheduled_job_scripts:
  - monitor.py
  - monitor_telegram.py
  - verify_monitor_telegram.py
  - matrix_status.py
  - backup_matrix_db.py
  - recovery_test.py
  - verify-backup.py
  - verify_matrix_db.py
  - verify_matrix_app.py
  - verify_vaultwarden_app.py
  - recovery_safety.py
  - matrix_recovery_client.py
  - vaultwarden_recovery_client.py

# Canonical files remain in monitoring/; substitute the target checkout path.
homelab_scheduled_job_source_path: /home/pentagon-admin/Projects/pentagon-homelab
