---
- name: Require a supported Debian host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: This baseline currently supports Debian-family hosts only.

- name: Ensure prerequisite packages are installed without upgrading installed versions
  ansible.builtin.apt:
    name: "{{ homelab_prerequisite_packages }}"
    state: present
    update_cache: false

- name: Ensure Docker starts at boot and is running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Verify required tools
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [docker, version]
    - [docker, compose, version]
    - [git, --version]
    - [curl, --version]
    - [dig, -v]
    - [btop, --version]
    - [restic, version]
  changed_when: false
  check_mode: false
