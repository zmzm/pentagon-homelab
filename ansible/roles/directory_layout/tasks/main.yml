---
- name: Inspect required directories without following symlinks
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ homelab_directories }}"
  loop_control:
    label: "{{ item.path }}"
  register: homelab_directory_stats

- name: Refuse existing files or symlinks in directory paths
  ansible.builtin.assert:
    quiet: true
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(false))
    fail_msg: "Expected a real directory at {{ item.item.path }}; inspect it manually."
  loop: "{{ homelab_directory_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Create only missing directories and preserve existing permissions
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: directory
    owner: "{{ item.item.owner | default(homelab_owner) }}"
    group: "{{ item.item.group | default(homelab_group) }}"
    mode: "{{ item.item.mode | default('0750') }}"
    recurse: false
  when: not item.stat.exists
  loop: "{{ homelab_directory_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
