homelab_repo_path: /home/pentagon-admin/Documents/homelab
homelab_apps_path: "{{ homelab_repo_path }}/apps"
homelab_data_path: "{{ homelab_repo_path }}/data"
homelab_backups_path: "{{ homelab_repo_path }}/backups"

homelab_owner: pentagon-admin
homelab_group: pentagon-admin

homelab_homepage_url: https://dashboard.home.arpa
homelab_homepage_ca_path: "{{ homelab_data_path }}/caddy/data/caddy/pki/authorities/local/root.crt"

homelab_portainer_url: https://docker.home.arpa
homelab_portainer_ca_path: "{{ homelab_homepage_ca_path }}"

homelab_vaultwarden_url: https://vault.home.arpa
homelab_vaultwarden_ca_path: "{{ homelab_homepage_ca_path }}"

homelab_backrest_url: https://backrest.home.arpa
homelab_backrest_ca_path: "{{ homelab_homepage_ca_path }}"
homelab_backrest_plan: pentagon-backup

homelab_unbound_image: ghcr.io/klutchell/unbound:latest
homelab_unbound_test_name: example.com

# Host preparation adds a missing official Docker repository and pins installed versions.
homelab_prerequisite_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - git
  - curl
  - bind9-dnsutils
  - btop
  - restic
  - python3-requests
  - python3-yaml

# Ownership/modes apply only to newly created directories.
homelab_directories:
  - path: "{{ homelab_data_path }}"
  - path: "{{ homelab_backups_path }}"
  - path: "{{ homelab_data_path }}/caddy"
  - path: "{{ homelab_data_path }}/cloudflared"
  - path: "{{ homelab_data_path }}/homepage"
  - path: "{{ homelab_data_path }}/matrix"
  - path: "{{ homelab_data_path }}/pihole"
  - path: "{{ homelab_data_path }}/portainer"
  - path: "{{ homelab_data_path }}/unbound"
  - path: "{{ homelab_data_path }}/vaultwarden"
  - path: "{{ homelab_data_path }}/backrest"
  - path: "{{ homelab_data_path }}/monitoring"
    owner: root
    group: root
    mode: '0700'
  - path: "{{ homelab_data_path }}/matrix/database-backup"
    owner: root
    group: root
    mode: '0700'

homelab_docker_networks:
  - proxy

homelab_compose_apps:
  - caddy
  - unbound
  - pihole
  - pihole-adapter
  - homepage
  - portainer
  - vaultwarden
  - backrest
  - matrix
  - cloudflared
  - watchtower
