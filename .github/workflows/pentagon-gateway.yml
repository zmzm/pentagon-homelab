name: Pentagon Gateway

on:
  pull_request:
    paths:
      - apps/pentagon-gateway/**
      - .github/workflows/pentagon-gateway.yml
  push:
    paths:
      - apps/pentagon-gateway/**
      - .github/workflows/pentagon-gateway.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pentagon-gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pentagon-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
