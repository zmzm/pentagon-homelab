name: personal-agent
services:
  hermes:
    image: ${HERMES_IMAGE:?set an arm64 Hermes image tag or digest}
    restart: unless-stopped
    command: [gateway, run]
    environment:
      GLM_API_KEY: ${GLM_API_KEY:?set GLM_API_KEY}
      GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-https://matrix.pentagonlab.org}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:?set dedicated Hermes bot token}
      MATRIX_ALLOWED_USERS: ${MATRIX_ALLOWED_USERS:?set allowed Matrix user IDs}
      MATRIX_ALLOWED_ROOMS: ${MATRIX_ALLOWED_ROOMS:?set allowed Matrix room IDs}
      MATRIX_HOME_ROOM: ${MATRIX_HOME_ROOM:?set Matrix room for scheduled results}
      MATRIX_REQUIRE_MENTION: "true"
      MATRIX_AUTO_THREAD: "true"
      MATRIX_ENCRYPTION: "false"
      HERMES_TIMEZONE: Europe/Warsaw
      GATEWAY_URL: http://pentagon-gateway:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set random 32+ character token}
    volumes:
      - ../../data/hermes:/opt/data
      - ./config.yaml:/opt/data/config.yaml:ro
      - ./SOUL.md:/opt/data/SOUL.md:ro
      - ./gateway_mcp.py:/integration/gateway_mcp.py:ro
      - ./skills:/opt/hermes-curated-skills:ro
      - ./plugins/homelab-skill-tools:/opt/data/plugins/homelab-skill-tools:ro
    networks: [agent, egress]
    depends_on:
      pentagon-gateway:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
  pentagon-gateway:
    build: ../pentagon-gateway
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN}
      APPROVER_TOKEN: ${APPROVER_TOKEN:?set a different operator-only token}
      BROKER_TOKEN: ${BROKER_TOKEN:?set a different broker token}
      BROKER_URL: http://homelab-broker:8081
      FLOWFORGE_URL: ${FLOWFORGE_URL:-}
      FLOWFORGE_INSPECT_URL: http://flowforge-inspect:8083
      FLOWFORGE_INSPECT_TOKEN: ${FLOWFORGE_INSPECT_TOKEN:?set an independent read-only inspection token}
      FLOWFORGE_TOKEN: ${FLOWFORGE_TOKEN:-}
      KNOWLEDGE_CLI: /knowledge-router/dist/cli.js
    volumes:
      - ../pentagon-gateway/policy.example.json:/config/policy.json:ro
      - ../../data/pentagon-gateway:/state
      - ./operator.mjs:/integration/operator.mjs:ro
      - ${KNOWLEDGE_ROUTER_PATH:-../../../apps/knowledge-router}:/knowledge-router:ro
      - ${CODING_VAULT_PATH:-../../../apps/obsidian-vaults/coding}:/vaults/coding:ro
      - ../../data/knowledge-mentory:/vaults/mentory:ro
      - ../../data/knowledge-homelab:/vaults/homelab:ro
    # No published ports. Operator approval uses docker compose exec, documented below.
    networks: [agent, operations, upstream]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: 1
  flowforge-api:
    build: ../flowforge
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FLOWFORGE_TOKEN: ${FLOWFORGE_TOKEN:?set FLOWFORGE_TOKEN}
      FLOWFORGE_SOURCE_PROJECT: ${MENTORY_PROJECT_PATH:-/home/pentagon-admin/Documents/apps/mentory}
      GLM_API_KEY: ${GLM_API_KEY:?set GLM_API_KEY}
      HOME: /state/home
      XDG_CONFIG_HOME: /state/home/.config
      XDG_DATA_HOME: /state/home/.local/share
      XDG_CACHE_HOME: /state/home/.cache
      NODE_ENV: production
    volumes:
      - ../../data/flowforge-api:/state
      - ${MENTORY_PROJECT_PATH:-/home/pentagon-admin/Documents/apps/mentory}:/source/project:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/pipeline_runner.py:/source/flowforge/pipeline_runner.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_config.py:/source/flowforge/flowforge_config.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_storage.py:/source/flowforge/flowforge_storage.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_status.py:/source/flowforge/flowforge_status.py:ro
      - ${FLOWFORGE_AGENT_LIBRARY_PATH:-/home/pentagon-admin/.config/flowforge/library}/agents/concept-plan.md:/source/planning-agents/concept-plan.md:ro
      - ${FLOWFORGE_AGENT_LIBRARY_PATH:-/home/pentagon-admin/.config/flowforge/library}/agents/grounded-hard.md:/source/planning-agents/grounded-hard.md:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/tasks.jsonl:/source/tasks.jsonl:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/steps.json:/source/steps.json:ro
      - ${OPENCODE_BINARY:-/home/pentagon-admin/.opencode/bin/opencode}:/usr/local/bin/opencode:ro
      - ${KNOWLEDGE_ROUTER_PATH:-/home/pentagon-admin/Documents/apps/knowledge-router}:/home/pentagon-admin/Documents/apps/knowledge-router:ro
      - ${CODING_VAULT_PATH:-/home/pentagon-admin/Documents/apps/obsidian-vaults/coding}:/home/pentagon-admin/Documents/apps/obsidian-vaults/coding:ro
    tmpfs: ["/tmp:size=128m,mode=1777"]
    networks: [upstream, egress]
    mem_limit: 2g
    cpus: 2
  matrix-approvals:
    build: ../pentagon-gateway
    restart: unless-stopped
    command: [node, src/matrix-approvals.mjs]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APPROVER_TOKEN: ${APPROVER_TOKEN:?set APPROVER_TOKEN}
      GATEWAY_URL: http://pentagon-gateway:8080
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-https://matrix.pentagonlab.org}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:?set MATRIX_ACCESS_TOKEN}
      MATRIX_ALLOWED_USERS: ${MATRIX_ALLOWED_USERS:?set MATRIX_ALLOWED_USERS}
      MATRIX_HOME_ROOM: ${MATRIX_HOME_ROOM:?set MATRIX_HOME_ROOM}
    volumes:
      - ../../data/matrix-approvals:/state
    networks: [agent, egress]
    depends_on:
      pentagon-gateway:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
  flowforge-inspect:
    build: ../flowforge
    command: [python3, inspector.py]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FLOWFORGE_INSPECT_TOKEN: ${FLOWFORGE_INSPECT_TOKEN:?set FLOWFORGE_INSPECT_TOKEN}
      FLOWFORGE_READ_PROJECTS: ${FLOWFORGE_READ_PROJECTS:-mentory}
      FLOWFORGE_CONFIG_DIR: ${FLOWFORGE_CONFIG_PATH:-/home/pentagon-admin/.config/flowforge}
      FLOWFORGE_STATE_DIR: ${FLOWFORGE_STATE_PATH:-/home/pentagon-admin/.local/state/flowforge}
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /nonexistent-inspection-home
    volumes:
      # Preserve native absolute paths from registered project configurations.
      # No config-root bind: notifications.env and backups stay outside this container.
      - ${FLOWFORGE_CONFIG_PATH:-/home/pentagon-admin/.config/flowforge}/projects:${FLOWFORGE_CONFIG_PATH:-/home/pentagon-admin/.config/flowforge}/projects:ro
      - type: bind
        source: ${FLOWFORGE_CONFIG_PATH:-/home/pentagon-admin/.config/flowforge}/workflows
        target: ${FLOWFORGE_CONFIG_PATH:-/home/pentagon-admin/.config/flowforge}/workflows
        read_only: true
        bind:
          create_host_path: false
      - ${FLOWFORGE_DEFAULTS_FILE:-../flowforge/inspection-defaults.json}:${FLOWFORGE_CONFIG_PATH:-/home/pentagon-admin/.config/flowforge}/config.json:ro
      - ${FLOWFORGE_AGENT_LIBRARY_PATH:-/home/pentagon-admin/.config/flowforge/library}:${FLOWFORGE_AGENT_LIBRARY_PATH:-/home/pentagon-admin/.config/flowforge/library}:ro
      - type: bind
        source: ${FLOWFORGE_STATE_PATH:-/home/pentagon-admin/.local/state/flowforge}
        target: ${FLOWFORGE_STATE_PATH:-/home/pentagon-admin/.local/state/flowforge}
        read_only: true
        bind:
          create_host_path: false
      - ${MENTORY_PROJECT_PATH:-/home/pentagon-admin/Documents/apps/mentory}:${MENTORY_PROJECT_PATH:-/home/pentagon-admin/Documents/apps/mentory}:ro
      # Directory binding follows atomic queue replacements. Hide the legacy credential file.
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}:${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}:ro
      - /dev/null:${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/.env:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/pipeline_runner.py:/source/flowforge/pipeline_runner.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_config.py:/source/flowforge/flowforge_config.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_storage.py:/source/flowforge/flowforge_storage.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_status.py:/source/flowforge/flowforge_status.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_agents.py:/source/flowforge/flowforge_agents.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_sync.py:/source/flowforge/flowforge_sync.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/flowforge_cli.py:/source/flowforge/flowforge_cli.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/watch-task.py:/source/flowforge/watch-task.py:ro
      - ${FLOWFORGE_PATH:-/home/pentagon-admin/Documents/apps/flow-forge-tui}/steps.json:/source/flowforge/steps.json:ro
      - ${OPENCODE_BINARY:-/home/pentagon-admin/.opencode/bin/opencode}:/usr/local/bin/opencode:ro
      - ${OPENCODE_BINARY:-/home/pentagon-admin/.opencode/bin/opencode}:${OPENCODE_BINARY:-/home/pentagon-admin/.opencode/bin/opencode}:ro
      - ${KNOWLEDGE_ROUTER_PATH:-/home/pentagon-admin/Documents/apps/knowledge-router}:/home/pentagon-admin/Documents/apps/knowledge-router:ro
      - ${CODING_VAULT_PATH:-/home/pentagon-admin/Documents/apps/obsidian-vaults/coding}:/home/pentagon-admin/Documents/apps/obsidian-vaults/coding:ro
    # Internal network only; no Docker socket, model key, writable state or session DB.
    networks: [upstream]
    mem_limit: 256m
    cpus: 1
  homelab-broker:
    build: ../pentagon-gateway
    restart: unless-stopped
    command: [node, src/broker.mjs]
    user: "1000:1000"
    group_add: ["${DOCKER_GID:?set Docker socket group ID}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN:?set BROKER_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../pentagon-gateway/policy.example.json:/config/policy.json:ro
    networks: [operations]
    mem_limit: 128m
    cpus: 0.5
networks:
  agent:
    name: agent-network
    internal: true
  operations:
    internal: true
  upstream:
    internal: true
  egress: {}
