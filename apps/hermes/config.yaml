model:
  provider: zai
  default: glm-5.3
  base_url: https://api.z.ai/api/coding/paas/v4
providers:
  zai:
    # Transport wait limits, not a total turn deadline or a tool timeout.
    request_timeout_seconds: 60
    stale_timeout_seconds: 60
agent:
  max_turns: 15
  api_max_retries: 1
  auto_recovery_cycles: 0
  # Native inactivity watchdog: warn once, then interrupt stalled work.
  # Model/tool activity resets this clock; it is not a total run limit.
  gateway_timeout_warning: 60
  gateway_timeout: 120
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - delegation
    - browser
    - messaging
    - debugging
platform_toolsets:
  cli: [memory, session_search, clarify, cronjob, mcp-personal, homelab-skills-read]
  matrix: [memory, session_search, clarify, cronjob, mcp-personal, homelab-skills-read]
  cron: [memory, session_search, mcp-personal, homelab-skills-read]
# Native group "skills" also exposes skill_manage. This local plugin defines
# a narrower group using the installed runtime's existing native read tools.
plugins:
  enabled: [homelab-skill-tools]
skills:
  external_dirs: [/opt/hermes-curated-skills]
  inline_shell: false
security:
  allow_lazy_installs: false
curator:
  enabled: false
group_sessions_per_user: true
display:
  platforms:
    matrix:
      # Installed native log mode retains tool progress privately instead of in chat.
      tool_progress: log
      interim_assistant_messages: false
      show_reasoning: false
tool_loop_guardrails:
  non_interactive_hard_stop_enabled: true
tools:
  tool_search:
    # The small allowlisted catalog fits directly in the model request.
    # Avoid extra model calls just to search for and describe its schemas.
    enabled: "off"
mcp_servers:
  personal:
    command: python
    args: [/integration/gateway_mcp.py]
    env:
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    timeout: 40
    tools:
      include: [knowledge_search, flowforge_list_workflows, flowforge_list_tasks, flowforge_get_run, flowforge_run, flowforge_list_projects, flowforge_get_project, flowforge_get_catalog, flowforge_get_project_status, flowforge_doctor, flowforge_preview_sync, homelab_list_services, homelab_inspect_service, homelab_get_logs, homelab_restart_service]
      resources: false
      prompts: false
