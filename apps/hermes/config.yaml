model:
  provider: zai
  default: glm-5.3
  base_url: https://api.z.ai/api/coding/paas/v4
agent:
  max_turns: 15
  api_max_retries: 1
  auto_recovery_cycles: 0
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - delegation
    - browser
    - messaging
    - debugging
platform_toolsets:
  cli: [memory, session_search, clarify, cronjob, mcp-personal, homelab-skills-read]
  matrix: [memory, session_search, clarify, cronjob, mcp-personal, homelab-skills-read]
  cron: [memory, session_search, mcp-personal, homelab-skills-read]
# Native group "skills" also exposes skill_manage. This local plugin defines
# a narrower group using the installed runtime's existing native read tools.
plugins:
  enabled: [homelab-skill-tools]
skills:
  external_dirs: [/opt/hermes-curated-skills]
  inline_shell: false
security:
  allow_lazy_installs: false
curator:
  enabled: false
group_sessions_per_user: true
tool_loop_guardrails:
  non_interactive_hard_stop_enabled: true
mcp_servers:
  personal:
    command: python
    args: [/integration/gateway_mcp.py]
    env:
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    timeout: 40
    tools:
      include: [knowledge_search, flowforge_list_workflows, flowforge_list_tasks, flowforge_get_run, flowforge_run, homelab_inspect_service, homelab_get_logs, homelab_restart_service]
      resources: false
      prompts: false
