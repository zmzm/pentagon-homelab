services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=dashboard.home.arpa
    volumes:
      - /home/pentagon-admin/Documents/homelab/data/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
networks:
  proxy:
    external: true
