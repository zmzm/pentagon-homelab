server:
    verbosity: 0

    interface: 0.0.0.0
    port: 53

    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    do-ip6: no
    prefer-ip6: no

    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no

    edns-buffer-size: 1232

    prefetch: yes
    prefetch-key: yes
    aggressive-nsec: yes

    cache-min-ttl: 300
    cache-max-ttl: 14400

    msg-cache-size: 128m
    rrset-cache-size: 256m
    key-cache-size: 64m

    num-threads: 2
    so-reuseport: yes

    outgoing-range: 8192
    num-queries-per-thread: 4096

    hide-identity: yes
    hide-version: yes

    private-address: 192.168.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: 100.64.0.0/10
    private-address: fd00::/8

    access-control: 0.0.0.0/0 allow

remote-control:
    control-enable: no
