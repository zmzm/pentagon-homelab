services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    pid: host
    networks:
      - proxy
    environment:
      NETDATA_CLAIM_URL: ${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:?set NETDATA_CLAIM_TOKEN}
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /home/pentagon-admin/Documents/homelab/data/netdata/config:/etc/netdata
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      - /home/pentagon-admin/Documents/homelab/data/netdata/lib:/var/lib/netdata
      - /home/pentagon-admin/Documents/homelab/data/netdata/cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Netdata
      - homepage.icon=netdata
      - homepage.href=https://netdata.home.arpa
      - homepage.description=Host and container monitoring
      - com.centurylinklabs.watchtower.enable=true

networks:
  proxy:
    external: true
