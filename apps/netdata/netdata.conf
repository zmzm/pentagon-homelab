[db]
    update every = 5s

[ml]
    enabled = no

[health]
    run at least every = 30s

[plugins]
    apps = no
    debugfs = no
    idlejitter = no
    network-viewer = no
    otel = no
    perf = no
    statsd = no
    tc = no

[plugin:cgroups]
    script to get cgroup network interfaces = /bin/echo

[plugin:proc:diskspace]
    update every = 30s
    check for new mount points every = 1m

[plugin:systemd-journal]
    update every = 10s

[plugin:otel]
    update every = 10s
