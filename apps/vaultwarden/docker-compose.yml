services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: false
      DOMAIN: "https://vault.home.arpa"
    volumes:
      - /home/pentagon-admin/Documents/homelab/data/vaultwarden/data:/data
    networks:
      - proxy
networks:
  proxy:
    external: true
